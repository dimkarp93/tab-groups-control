<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <title>Tab groups</title>
  </head>
  <body>
    <button class="help-btn" id="help" data-i18n-title="helpButton" data-i18n-aria-label="helpButton">?</button>
    <h1 data-i18n="extActionTitle"></h1>
    <p class="hint" data-i18n="popupHint"></p>
    <ul class="list" id="list"></ul>
    <div class="actions">
      <button id="save" data-i18n="popupSave"></button>
      <button id="restore" data-i18n="popupRestore"></button>
      <button id="close-ungrouped" data-i18n="popupCloseUngrouped"></button>
      <button id="file" data-i18n="popupProfiles"></button>
    </div>
    <p class="hint" id="saved"></p>
    <script src="i18n.js"></script>
    <script src="help.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
