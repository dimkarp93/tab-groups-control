<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <title>Группы вкладок</title>
  </head>
  <body>
    <h1>Группы вкладок</h1>
    <p class="hint">Нажмите цифру 0–9 или выберите строку мышью.</p>
    <ul class="list" id="list"></ul>
    <div class="actions">
      <button id="save">Сохранить (Ctrl+Alt+S)</button>
      <button id="restore">Восстановить (Ctrl+Alt+R)</button>
      <button id="close-ungrouped">Закрыть вне групп (Ctrl+Alt+W)</button>
      <button id="file">Профили / экспорт…</button>
    </div>
    <p class="hint" id="saved"></p>
    <script src="popup.js"></script>
  </body>
</html>
